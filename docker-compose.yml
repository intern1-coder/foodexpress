# ============================================
# FoodExpress - Docker Compose Configuration
# ============================================
# Description: Food Delivery Platform Infrastructure

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: foodexpress-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodexpress}
      POSTGRES_USER: ${POSTGRES_USER:-foodexpress_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password_here}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql
    networks:
      - foodexpress-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodexpress_admin} -d ${POSTGRES_DB:-foodexpress}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Node.js Backend API
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodexpress-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-foodexpress}
      POSTGRES_USER: ${POSTGRES_USER:-foodexpress_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password_here}
      DATABASE_URL: postgresql://${POSTGRES_USER:-foodexpress_admin}:${POSTGRES_PASSWORD:-your_secure_password_here}@postgres:5432/${POSTGRES_DB:-foodexpress}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foodexpress-network
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================
  # React Frontend (Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodexpress-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - foodexpress-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
    name: foodexpress-postgres-data

# ============================================
# Networks
# ============================================
networks:
  foodexpress-network:
    driver: bridge
    name: foodexpress-network
    ipam:
      config:
        - subnet: 172.20.0.0/16
