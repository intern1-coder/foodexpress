<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Express - Login / Register</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 32px;
            width: 100%;
            max-width: 420px;
        }

        .auth-card h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .auth-card .role-badge {
            text-align: center;
            margin-bottom: 20px;
        }

        .auth-card .role-badge span {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            text-transform: capitalize;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 24px;
            border-bottom: 2px solid #ecf0f1;
        }

        .auth-tabs button {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: #7f8c8d;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .auth-tabs button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff !important;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .error-msg {
            background: #fdecea;
            color: #c0392b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 0.9rem;
            display: none;
        }

        .error-msg.show { display: block; }

        a.back {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Food Express</h1>
        <div class="role-badge"><span id="role-badge">Customer</span></div>

        <div class="auth-tabs" role="tablist" aria-label="Authentication options">
            <button type="button" class="active" id="tab-login" role="tab" aria-selected="true" aria-controls="login-form">Login</button>
            <button type="button" id="tab-register" role="tab" aria-selected="false" aria-controls="register-form">Register</button>
        </div>

        <div id="error-msg" class="error-msg"></div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form active" role="tabpanel" aria-labelledby="tab-login">
            <div class="form-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn-primary">Login</button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form" role="tabpanel" aria-labelledby="tab-register" hidden>
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" required>
            </div>
            <div class="form-group">
                <label for="reg-email">Email</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="form-group">
                <label for="reg-phone">Phone Number</label>
                <input type="tel" id="reg-phone">
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" minlength="6" required>
            </div>
            <div class="form-group" id="vehicle-group" style="display:none;">
                <label for="reg-vehicle">Vehicle Type</label>
                <select id="reg-vehicle">
                    <option value="bicycle">Bicycle</option>
                    <option value="motorcycle" selected>Motorcycle</option>
                    <option value="car">Car</option>
                    <option value="van">Van</option>
                </select>
            </div>
            <div class="form-group">
                <label for="reg-address">Address</label>
                <input type="text" id="reg-address" placeholder="Street, City">
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <a href="../index.html" class="back">&larr; Back to role selection</a>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
