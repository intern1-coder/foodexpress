<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Express - Delivery Dashboard</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Food Express</h1>
            <div class="user-info">
                <label class="online-toggle">
                    <input type="checkbox" id="online-toggle">
                    <span id="online-label">Offline</span>
                </label>
                <span id="user-name">Welcome, Delivery Partner!</span>
                <button id="logout-btn">Logout</button>
            </div>
        </header>

        <nav>
            <button class="nav-btn active" id="available-deliveries-btn">Assigned Deliveries</button>
            <button class="nav-btn" id="my-deliveries-btn">My Deliveries</button>
            <button class="nav-btn" id="earnings-btn">Earnings</button>
            <button class="nav-btn" id="profile-btn">Profile</button>
        </nav>

        <main>
            <section id="available-deliveries" class="tab-content active">
                <h2>Assigned Deliveries</h2>
                <p class="muted">Orders the restaurant has assigned to you. Accept or reject them here.</p>
                <div id="available-deliveries-list" class="deliveries-grid">
                    <!-- Assigned deliveries will be loaded here -->
                </div>
            </section>

            <section id="my-deliveries" class="tab-content">
                <h2>My Deliveries</h2>
                <div id="my-deliveries-list" class="deliveries-list">
                    <!-- My deliveries will be loaded here -->
                </div>
            </section>

            <section id="earnings" class="tab-content">
                <h2>Earnings</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Today's Earnings</h3>
                        <p id="today-earnings" class="earnings">$0.00</p>
                    </div>
                    <div class="stat-card">
                        <h3>This Week's Earnings</h3>
                        <p id="week-earnings" class="earnings">$0.00</p>
                    </div>
                    <div class="stat-card">
                        <h3>Total Deliveries</h3>
                        <p id="total-deliveries">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Average Rating</h3>
                        <p id="average-rating">5.0★</p>
                    </div>
                </div>

                <h3>Completed Deliveries</h3>
                <div id="recent-deliveries-list" class="deliveries-list">
                    <!-- Recent deliveries will be loaded here -->
                </div>
            </section>

            <section id="profile" class="tab-content">
                <h2>Profile</h2>
                <form id="profile-form">
                    <div class="form-group">
                        <label for="profile-name">Full Name</label>
                        <input type="text" id="profile-name" required>
                    </div>
                    <div class="form-group">
                        <label for="profile-email">Email</label>
                        <input type="email" id="profile-email" required readonly>
                    </div>
                    <div class="form-group">
                        <label for="profile-phone">Phone Number</label>
                        <input type="tel" id="profile-phone">
                    </div>
                    <div class="form-group">
                        <label for="profile-address">Address</label>
                        <textarea id="profile-address" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="profile-vehicle">Vehicle Type</label>
                        <select id="profile-vehicle">
                            <option value="bicycle">Bicycle</option>
                            <option value="motorcycle">Motorcycle</option>
                            <option value="car">Car</option>
                            <option value="van">Van</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Update Profile</button>
                </form>
            </section>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
